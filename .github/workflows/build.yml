name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

env:
  JAVA_VERSION: '21'
  FLUTTER_VERSION: '3.44.1'
  FFMPEG_VERSION: '8.1.1'
  APP_NAME: ${{ github.event.repository.name }}

jobs:
  metadata:
    runs-on: ubuntu-latest
    name: Prepare package metadata
    outputs:
      app_version: ${{ steps.version.outputs.jversion }}
      project_name: ${{ steps.project.outputs.project_name }}
    steps:
      - name: Prepare package version
        id: version
        shell: bash
        run: |
          jversion="0.1.0"
          
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            raw_tag="${{ github.ref_name }}"
            echo "Detected Tag: $raw_tag"
          
            # 去除 'v' 或 'V' 前缀 (支持 v1.0.0, V1.0.0, 1.0.0)
            version=$(echo "$raw_tag" | sed -E 's/^[vV]//')
          
            # 规范化版本 (只保留数字部分 x.y.z，去掉 -rc, -beta 等后缀用于 jpackage)
            jversion=$(echo "$version" | sed -E 's/^([0-9]+\.[0-9]+(\.[0-9]+)?).*/\1/')
          
            if [ -z "$jversion" ]; then
              echo "Warning: Could not parse numeric version from tag $raw_tag, defaulting to 0.1.0"
              jversion="0.1.0"
            fi
            echo "Using Tag Version: $version (JPackage: $jversion)"
          fi

          echo "jversion=$jversion" >> $GITHUB_OUTPUT

      - name: Compute project name
        id: project
        shell: bash
        run: |
          projectName=$(echo "${{ env.APP_NAME }}" | tr '-' '_')
          echo "project_name=$projectName" >> $GITHUB_OUTPUT
          echo "Project name for Flutter: $projectName"

  build-android:
    needs: [ metadata ]
    runs-on: ubuntu-latest
    name: Build Android APK
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Rename Android APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk ./${{ env.APP_NAME }}-${{ needs.metadata.outputs.app_version }}-android-aarch64.apk

      - name: Upload Android artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}-${{ needs.metadata.outputs.app_version }}-android-aarch64.apk
          path: ${{ env.APP_NAME }}-${{ needs.metadata.outputs.app_version }}-android-aarch64.apk
          retention-days: 1

  build-windows:
    needs: [ metadata ]
    runs-on: windows-latest
    name: Build Windows EXE
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Print environment info
        shell: pwsh
        run: |
          Write-Host "========================================"
          Write-Host "  构建环境信息"
          Write-Host "========================================"
          Write-Host "OS: $($env:OS) $($env:PROCESSOR_ARCHITECTURE)"
          Write-Host "USERPROFILE: $env:USERPROFILE"
          Write-Host "PWD: $(Get-Location)"
          flutter --version
          dart --version
          Write-Host "========================================"

      - name: Generate Windows platform files
        run: flutter create --platforms=windows --project-name ${{ needs.metadata.outputs.project_name }} .

      - name: Switch to Windows platform files
        shell: pwsh
        run: |
          Copy-Item -Path pubspec_windows.yaml -Destination pubspec.yaml -Force
          Copy-Item -Path lib/services/ffmpeg_windows.dart -Destination lib/services/ffmpeg_platform.dart -Force

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: List build output
        shell: pwsh
        run: |
          $releaseDir = 'build\windows\x64\runner\Release'
          Write-Host "========================================"
          Write-Host "  构建产物列表: $releaseDir"
          Write-Host "========================================"
          if (Test-Path $releaseDir) {
            Get-ChildItem $releaseDir | ForEach-Object {
              $sizeMB = [math]::Round($_.Length / 1MB, 2)
              Write-Host "  $($_.Name)  ($sizeMB MB)"
            }
            $totalMB = [math]::Round((Get-ChildItem $releaseDir | Measure-Object Length -Sum).Sum / 1MB, 2)
            Write-Host "  总大小: $totalMB MB"
          } else {
            Write-Host "  [目录不存在]"
          }
          Write-Host "========================================"

      - name: Download ffmpeg (bundle for native merging)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ffmpegUrl = 'https://github.com/GyanD/codexffmpeg/releases/download/${{ env.FFMPEG_VERSION }}/ffmpeg-${{ env.FFMPEG_VERSION }}-essentials_build.zip'
          Write-Host "========================================"
          Write-Host "  下载 ffmpeg"
          Write-Host "========================================"
          Write-Host "URL: $ffmpegUrl"
          Invoke-WebRequest -UseBasicParsing -Uri $ffmpegUrl -OutFile ffmpeg.zip
          $zipSizeMB = [math]::Round((Get-Item ffmpeg.zip).Length / 1MB, 2)
          Write-Host "下载完成: ffmpeg.zip ($zipSizeMB MB)"
          Write-Host "解压中..."
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg-extracted -Force
          Write-Host "查找 ffmpeg.exe..."
          $bin = Get-ChildItem -Path ffmpeg-extracted -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $bin) { throw 'ffmpeg.exe not found in archive' }
          Write-Host "找到: $($bin.FullName) ($([math]::Round($bin.Length / 1MB, 2)) MB)"
          $releaseDir = 'build\windows\x64\runner\Release'
          Copy-Item $bin.FullName -Destination (Join-Path $releaseDir 'ffmpeg.exe') -Force
          Write-Host "已拷贝 ffmpeg.exe 到 $releaseDir"
          # 删除多余的 ffprobe.exe（非必需，节省约 83MB）
          $ffprobePath = Join-Path $releaseDir 'ffprobe.exe'
          if (Test-Path $ffprobePath) {
            $ffprobeSizeMB = [math]::Round((Get-Item $ffprobePath).Length / 1MB, 2)
            Remove-Item $ffprobePath -Force
            Write-Host "已删除 ffprobe.exe (节省 $ffprobeSizeMB MB)"
          }
          Write-Host "========================================"
          Write-Host "  最终产物列表:"
          Get-ChildItem $releaseDir | ForEach-Object {
            $sizeMB = [math]::Round($_.Length / 1MB, 2)
            Write-Host "  $($_.Name)  ($sizeMB MB)"
          }
          $totalMB = [math]::Round((Get-ChildItem $releaseDir | Measure-Object Length -Sum).Sum / 1MB, 2)
          Write-Host "  总大小: $totalMB MB"
          Write-Host "========================================"

      - name: Create Windows ZIP
        shell: pwsh
        run: |
          Write-Host "创建 ZIP 包..."
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath windows.zip
          $zipSizeMB = [math]::Round((Get-Item windows.zip).Length / 1MB, 2)
          Write-Host "ZIP 创建完成: windows.zip ($zipSizeMB MB)"

      - name: Rename Windows ZIP
        run: |
          mv windows.zip ./${{ env.APP_NAME }}-${{ needs.metadata.outputs.app_version }}-windows-x86_64.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}-${{ needs.metadata.outputs.app_version }}-windows-x86_64.zip
          path: ${{ env.APP_NAME }}-${{ needs.metadata.outputs.app_version }}-windows-x86_64.zip
          retention-days: 1


  # ========== 发布到 GitHub Releases ==========
  release:
    needs: [ build-android, build-windows ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write  # ✅ 仅 release job 需要写权限
    environment: release  # ✅ 添加环境保护（可选：要求审批）

    steps:
      - name: Checkout code (for changelog)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # ✅ 必须获取完整 tag 历史

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true  # ✅ 简化目录结构

      - name: Generate release notes
        id: notes
        run: |
          # 获取上一个标签
          current_tag=${GITHUB_REF#refs/tags/}
          prev_tag=$(git tag --sort=-version:refname | grep -v "^$current_tag$" | head -1)
          
          body_content=""
          if [[ -n "$prev_tag" ]]; then
            body_content=$(git log --pretty=format:"* %s (%h)" "$prev_tag".."$current_tag" -- . ":(exclude)docs" ":(exclude).github")
          else
            body_content="Initial release or no previous tag found."
          fi
          
          # 写入输出，处理多行字符
          {
            echo "body<<EOF"
            echo "$body_content"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.body }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}  # ✅ 自动识别预发布
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}