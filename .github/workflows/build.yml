name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: build-${{ github.sha }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'
  FLUTTER_VERSION: '3.47.7'
  APP_NAME: ${{ github.event.repository.name }}

jobs:
  metadata:
    runs-on: ubuntu-latest
    name: Prepare package metadata
    outputs:
      app_version: ${{ steps.version.outputs.jversion }}
      project_name: ${{ steps.project.outputs.project_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Prepare package version
        id: version
        shell: bash
        run: |
          jversion=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            raw_tag="${{ github.ref_name }}"
            version=$(echo "$raw_tag" | sed -E 's/^[vV]//')
            jversion=$(echo "$version" | sed -E 's/^([0-9]+\.[0-9]+(\.[0-9]+)?).*/\1/')
            if [ -z "$jversion" ]; then
              jversion=$(grep '^version:' pubspec.yaml | awk '{print $2}')
            fi
          fi
          echo "jversion=$jversion" >> $GITHUB_OUTPUT
          echo "Using version: $jversion"

      - name: Compute project name
        id: project
        shell: bash
        run: |
          projectName=$(echo "${{ env.APP_NAME }}" | tr '-' '_')
          echo "project_name=$projectName" >> $GITHUB_OUTPUT
          echo "Project name for Flutter: $projectName"

  test:
    needs: [ metadata ]
    runs-on: ubuntu-latest
    name: Run Dart tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

  build-android:
    needs: [ metadata, test ]
    runs-on: ubuntu-latest
    name: Build Android APK
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Rename Android APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk ./${{ env.APP_NAME }}-${{ needs.metadata.outputs.app_version }}-android-aarch64.apk

      - name: Upload Android artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}-${{ needs.metadata.outputs.app_version }}-android-aarch64.apk
          path: ${{ env.APP_NAME }}-${{ needs.metadata.outputs.app_version }}-android-aarch64.apk
          retention-days: 1

  build-windows:
    needs: [ metadata, test ]
    runs-on: windows-latest
    name: Build Windows EXE
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Print environment info
        shell: pwsh
        run: |
          Write-Host "========================================"
          Write-Host "  构建环境信息"
          Write-Host "========================================"
          Write-Host "OS: $($env:OS) $($env:PROCESSOR_ARCHITECTURE)"
          Write-Host "USERPROFILE: $env:USERPROFILE"
          Write-Host "PWD: $(Get-Location)"
          flutter --version
          dart --version
          Write-Host "========================================"

      # 先解析依赖再生成平台文件：与 Gitea 侧同序（flutter create 内部也会跑 pub get）
      - name: Install dependencies
        run: flutter pub get

      - name: Generate Windows platform files
        run: flutter create --platforms=windows --project-name ${{ needs.metadata.outputs.project_name }} .

      # 原生资产工具链版本会在两端漂移（Linux 解析到 hooks 2.2.0 / record_use 1.1.1，
      # Windows 解析到 hooks 2.0.2 / record_use 0.6.0），留一行便于对照
      - name: Show resolved native-assets toolchain
        shell: pwsh
        run: flutter pub deps --style=compact | Select-String -Pattern 'hooks|code_assets|record_use|native_toolchain_c'

      - name: Build Windows
        run: flutter build windows --release

      # 钩子的报错被 MSBuild 吞成一行，失败时把钩子自己的 stdout/stderr 留进日志
      - name: Dump ffmpeg-kit hook state (on failure)
        if: failure()
        shell: pwsh
        run: |
          Write-Host "=== 钩子 stdout / stderr / output.json ==="
          Get-ChildItem -Recurse -Force -File .dart_tool\hooks_runner -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -in @('stdout.txt', 'stderr.txt', 'output.json') } |
            Sort-Object FullName |
            ForEach-Object {
              Write-Host "--- $($_.FullName.Replace("$PWD\", '')) ($($_.Length) bytes) ---"
              Get-Content -LiteralPath $_.FullName -TotalCount 200 -ErrorAction SilentlyContinue
            }
          Write-Host "=== DLL 落点 ==="
          Get-ChildItem -Recurse -Force -Filter *.dll -Path .dart_tool\hooks_runner\shared, build\windows -ErrorAction SilentlyContinue |
            Select-Object -First 20 |
            ForEach-Object { '{0,10}  {1}' -f $_.Length, $_.FullName.Replace("$PWD\", '') }

      - name: List build output
        shell: pwsh
        run: |
          $releaseDir = 'build\windows\x64\runner\Release'
          Write-Host "========================================"
          Write-Host "  构建产物列表: $releaseDir"
          Write-Host "========================================"
          if (Test-Path $releaseDir) {
            Get-ChildItem $releaseDir | ForEach-Object {
              $sizeMB = [math]::Round($_.Length / 1MB, 2)
              Write-Host "  $($_.Name)  ($sizeMB MB)"
            }
            $totalMB = [math]::Round((Get-ChildItem $releaseDir | Measure-Object Length -Sum).Sum / 1MB, 2)
            Write-Host "  总大小: $totalMB MB"
          } else {
            Write-Host "  [目录不存在]"
          }
          Write-Host "========================================"

      - name: Create Windows ZIP
        shell: pwsh
        run: |
          Write-Host "创建 ZIP 包..."
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath windows.zip
          $zipSizeMB = [math]::Round((Get-Item windows.zip).Length / 1MB, 2)
          Write-Host "ZIP 创建完成: windows.zip ($zipSizeMB MB)"

      - name: Rename Windows ZIP
        run: |
          mv windows.zip ./${{ env.APP_NAME }}-${{ needs.metadata.outputs.app_version }}-windows-x86_64.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}-${{ needs.metadata.outputs.app_version }}-windows-x86_64.zip
          path: ${{ env.APP_NAME }}-${{ needs.metadata.outputs.app_version }}-windows-x86_64.zip
          retention-days: 1


  # ========== 发布到 GitHub Releases ==========
  release:
    needs: [ build-android, build-windows ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write  # ✅ 仅 release job 需要写权限
    environment: release  # ✅ 添加环境保护（可选：要求审批）

    steps:
      - name: Checkout code (for changelog)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # ✅ 必须获取完整 tag 历史

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true  # ✅ 简化目录结构

      - name: Generate release notes
        id: notes
        run: |
          # 获取上一个标签
          current_tag=${GITHUB_REF#refs/tags/}
          prev_tag=$(git tag --sort=-version:refname | grep -v "^$current_tag$" | head -1)
          
          body_content=""
          if [[ -n "$prev_tag" ]]; then
            body_content=$(git log --pretty=format:"* %s (%h)" "$prev_tag".."$current_tag" -- . ":(exclude)docs" ":(exclude).github")
          else
            body_content="Initial release or no previous tag found."
          fi
          
          # 写入输出，处理多行字符
          {
            echo "body<<EOF"
            echo "$body_content"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.body }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}  # ✅ 自动识别预发布
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}