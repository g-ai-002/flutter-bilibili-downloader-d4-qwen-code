name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: build-${{ github.sha }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'
  FLUTTER_VERSION: '3.47.7'
  APP_NAME: ${{ github.event.repository.name }}

jobs:
  metadata:
    runs-on: ubuntu-latest
    name: Prepare package metadata
    outputs:
      app_version: ${{ steps.version.outputs.jversion }}
      project_name: ${{ steps.project.outputs.project_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Prepare package version
        id: version
        shell: bash
        run: |
          jversion=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            raw_tag="${{ github.ref_name }}"
            version=$(echo "$raw_tag" | sed -E 's/^[vV]//')
            jversion=$(echo "$version" | sed -E 's/^([0-9]+\.[0-9]+(\.[0-9]+)?).*/\1/')
            if [ -z "$jversion" ]; then
              jversion=$(grep '^version:' pubspec.yaml | awk '{print $2}')
            fi
          fi
          echo "jversion=$jversion" >> $GITHUB_OUTPUT
          echo "Using version: $jversion"

      - name: Compute project name
        id: project
        shell: bash
        run: |
          projectName=$(echo "${{ env.APP_NAME }}" | tr '-' '_')
          echo "project_name=$projectName" >> $GITHUB_OUTPUT
          echo "Project name for Flutter: $projectName"

  test:
    needs: [ metadata ]
    runs-on: ubuntu-latest
    name: Run Dart tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

  build-android:
    needs: [ metadata, test ]
    runs-on: ubuntu-latest
    name: Build Android APK
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Rename Android APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk ./${{ env.APP_NAME }}-${{ needs.metadata.outputs.app_version }}-android-aarch64.apk

      - name: Upload Android artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}-${{ needs.metadata.outputs.app_version }}-android-aarch64.apk
          path: ${{ env.APP_NAME }}-${{ needs.metadata.outputs.app_version }}-android-aarch64.apk
          retention-days: 1

  build-windows:
    needs: [ metadata, test ]
    runs-on: windows-latest
    name: Build Windows EXE
    permissions:
      contents: read
    defaults:
      run:
        working-directory: C:\w
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Copy project to a short path
        shell: bash
        working-directory: C:/
        run: |
          set -euo pipefail
          src=$(cygpath -u "$GITHUB_WORKSPACE")
          rm -rf /c/w
          mkdir -p /c/w
          cp -a "$src"/. /c/w/
          echo "project copied: $src -> C:\\w"

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Print environment info
        run: |
          echo "========================================"
          echo "  构建环境信息"
          echo "========================================"
          echo "OS: ${RUNNER_OS:-?} / ${PROCESSOR_ARCHITECTURE:-?}"
          echo "PWD: $(pwd)"
          flutter --version
          dart --version
          echo "========================================"

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Windows platform files
        run: flutter create --platforms=windows --project-name ${{ needs.metadata.outputs.project_name }} .

      - name: Build Windows
        run: flutter build windows --release

      - name: Dump ffmpeg-kit hook state (on failure)
        if: failure()
        run: |
          echo "=== 钩子 stdout / stderr / output.json ==="
          find .dart_tool/hooks_runner -type f \( -name stdout.txt -o -name stderr.txt -o -name output.json \) 2>/dev/null | sort | while read -r f; do
            echo "--- $f ($(stat -c%s "$f") bytes) ---"
            head -200 "$f"
          done
          echo "=== DLL 落点 ==="
          find .dart_tool/hooks_runner/shared build/windows -name '*.dll' 2>/dev/null | head -20

      - name: List build output
        run: |
          release_dir='build/windows/x64/runner/Release'
          if [ -d "$release_dir" ]; then
            total_bytes=0
            for f in "$release_dir"/*; do
              if [ -f "$f" ]; then
                size=$(stat -c%s "$f")
                size_mb=$(awk "BEGIN{printf \"%.2f\", $size/1048576}")
                echo "  $(basename "$f")  ($size_mb MB)"
                total_bytes=$((total_bytes + size))
              fi
            done
            total_mb=$(awk "BEGIN{printf \"%.2f\", $total_bytes/1048576}")
            echo "  合计: $total_mb MB"
          else
            echo "❌ 未找到构建输出目录"
            exit 1
          fi

      - name: Create Windows ZIP
        shell: pwsh
        run: |
          Write-Host "创建 ZIP 包..."
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath windows.zip
          $zipSizeMB = [math]::Round((Get-Item windows.zip).Length / 1MB, 2)
          Write-Host "ZIP 创建完成: windows.zip ($zipSizeMB MB)"

      - name: Rename Windows ZIP
        run: |
          mv windows.zip ./${{ env.APP_NAME }}-${{ needs.metadata.outputs.app_version }}-windows-x86_64.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}-${{ needs.metadata.outputs.app_version }}-windows-x86_64.zip
          path: C:/w/${{ env.APP_NAME }}-${{ needs.metadata.outputs.app_version }}-windows-x86_64.zip
          retention-days: 1


  # ========== 发布到 GitHub Releases ==========
  release:
    needs: [ build-android, build-windows ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write  # ✅ 仅 release job 需要写权限
    environment: release  # ✅ 添加环境保护（可选：要求审批）

    steps:
      - name: Checkout code (for changelog)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # ✅ 必须获取完整 tag 历史

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true  # ✅ 简化目录结构

      - name: Generate release notes
        id: notes
        run: |
          # 获取上一个标签
          current_tag=${GITHUB_REF#refs/tags/}
          prev_tag=$(git tag --sort=-version:refname | grep -v "^$current_tag$" | head -1)
          
          body_content=""
          if [[ -n "$prev_tag" ]]; then
            body_content=$(git log --pretty=format:"* %s (%h)" "$prev_tag".."$current_tag" -- . ":(exclude)docs" ":(exclude).github")
          else
            body_content="Initial release or no previous tag found."
          fi
          
          # 写入输出，处理多行字符
          {
            echo "body<<EOF"
            echo "$body_content"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.body }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}  # ✅ 自动识别预发布
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}