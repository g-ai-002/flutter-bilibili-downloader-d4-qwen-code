name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: build-${{ github.sha }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'
  FLUTTER_VERSION: '3.47.7'
  APP_NAME: ${{ github.event.repository.name }}
  # Windows 产物内置的 ffmpeg-kit 原生库：上游 builder 版本、bundle 文件名与两个校验值
  FFMPEG_KIT_BUILDER: '0.11.1'
  FFMPEG_KIT_WIN_BUNDLE: 'bundle-base-windows-x86_64-shared-lgpl.zip'
  FFMPEG_KIT_WIN_SHA256: 'ac4f7c6893eb2d2a7d9c1c7a08e8cad42105b509d097ce2b2eceabcdcbd7cb47'
  FFMPEG_KIT_DLL_SHA256: '888a15993862950feed714990e459f653b68bbc2ce30da7d4bda8db9a5212c06'

jobs:
  metadata:
    runs-on: ubuntu-latest
    name: Prepare package metadata
    outputs:
      app_version: ${{ steps.version.outputs.jversion }}
      project_name: ${{ steps.project.outputs.project_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Prepare package version
        id: version
        shell: bash
        run: |
          jversion=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            raw_tag="${{ github.ref_name }}"
            version=$(echo "$raw_tag" | sed -E 's/^[vV]//')
            jversion=$(echo "$version" | sed -E 's/^([0-9]+\.[0-9]+(\.[0-9]+)?).*/\1/')
            if [ -z "$jversion" ]; then
              jversion=$(grep '^version:' pubspec.yaml | awk '{print $2}')
            fi
          fi
          echo "jversion=$jversion" >> $GITHUB_OUTPUT
          echo "Using version: $jversion"

      - name: Compute project name
        id: project
        shell: bash
        run: |
          projectName=$(echo "${{ env.APP_NAME }}" | tr '-' '_')
          echo "project_name=$projectName" >> $GITHUB_OUTPUT
          echo "Project name for Flutter: $projectName"

  test:
    needs: [ metadata ]
    runs-on: ubuntu-latest
    name: Run Dart tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

  build-android:
    needs: [ metadata, test ]
    runs-on: ubuntu-latest
    name: Build Android APK
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Rename Android APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk ./${{ env.APP_NAME }}-${{ needs.metadata.outputs.app_version }}-android-aarch64.apk

      - name: Upload Android artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}-${{ needs.metadata.outputs.app_version }}-android-aarch64.apk
          path: ${{ env.APP_NAME }}-${{ needs.metadata.outputs.app_version }}-android-aarch64.apk
          retention-days: 1

  build-windows:
    needs: [ metadata, test ]
    runs-on: windows-latest
    name: Build Windows EXE
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Print environment info
        shell: pwsh
        run: |
          Write-Host "========================================"
          Write-Host "  构建环境信息"
          Write-Host "========================================"
          Write-Host "OS: $($env:OS) $($env:PROCESSOR_ARCHITECTURE)"
          Write-Host "USERPROFILE: $env:USERPROFILE"
          Write-Host "PWD: $(Get-Location)"
          flutter --version
          dart --version
          Write-Host "========================================"

      - name: Generate Windows platform files
        run: flutter create --platforms=windows --project-name ${{ needs.metadata.outputs.project_name }} .

      # ffmpeg-kit 原生库：上游 bundle 的内部目录名较长，Windows 上 Expand-Archive 会因
      # MAX_PATH 静默失败（详见 plan.md），因此下载后重打包成短名 fk.zip——内部根目录同为
      # fk，正好满足钩子「<extractRoot>/<zip 同名目录>」的回退要求。
      - name: Prepare ffmpeg-kit Windows bundle
        shell: bash
        run: |
          set -euo pipefail
          url="https://gh-proxy.org/https://github.com/akashskypatel/ffmpeg-kit-builders/releases/download/v${FFMPEG_KIT_BUILDER}-windows/${FFMPEG_KIT_WIN_BUNDLE}"
          mkdir -p ffmpeg-kit-bundle
          echo "URL: $url"
          curl -fL --retry 3 --connect-timeout 30 -o "ffmpeg-kit-bundle/$FFMPEG_KIT_WIN_BUNDLE" "$url"
          actual=$(sha256sum "ffmpeg-kit-bundle/$FFMPEG_KIT_WIN_BUNDLE" | awk '{print $1}')
          if [ "$actual" != "$FFMPEG_KIT_WIN_SHA256" ]; then
            echo "❌ bundle sha256 不符：$actual"
            exit 1
          fi
          rm -rf ffmpeg-kit-bundle/work
          powershell.exe -NoProfile -NonInteractive -Command \
            "Expand-Archive -Path 'ffmpeg-kit-bundle\\$FFMPEG_KIT_WIN_BUNDLE' -DestinationPath 'ffmpeg-kit-bundle\\work' -Force"
          mv "ffmpeg-kit-bundle/work/${FFMPEG_KIT_WIN_BUNDLE%.zip}" ffmpeg-kit-bundle/work/fk
          powershell.exe -NoProfile -NonInteractive -Command \
            "Compress-Archive -Path 'ffmpeg-kit-bundle\\work\\fk' -DestinationPath 'ffmpeg-kit-bundle\\fk.zip' -Force"
          dll_sha=$(sha256sum ffmpeg-kit-bundle/work/fk/bin/libffmpegkit.dll | awk '{print $1}')
          if [ "$dll_sha" != "$FFMPEG_KIT_DLL_SHA256" ]; then
            echo "❌ libffmpegkit.dll sha256 不符：$dll_sha"
            exit 1
          fi
          ls -l ffmpeg-kit-bundle/fk.zip
          echo "✅ 已生成短名 bundle ffmpeg-kit-bundle/fk.zip"

      # 用绝对路径指向本地短名 bundle：无论钩子把 appRoot 解析成什么都能命中
      - name: Point ffmpeg-kit config to the local bundle
        shell: bash
        run: |
          set -euo pipefail
          bundle_win=$(cygpath -m "$PWD/ffmpeg-kit-bundle/fk.zip")
          awk '!/^  windows: /' pubspec.yaml > pubspec.clean.yaml
          mv pubspec.clean.yaml pubspec.yaml
          awk -v line="  windows: \"$bundle_win\"" \
            '{ print } /^ffmpeg_kit_extended_config:/ { print line }' \
            pubspec.yaml > pubspec.patched.yaml
          mv pubspec.patched.yaml pubspec.yaml
          grep -n -A4 '^ffmpeg_kit_extended_config:' pubspec.yaml
          grep -q '^  windows: ' pubspec.yaml || { echo "❌ windows 覆盖未写入 pubspec.yaml"; exit 1; }

      - name: Install dependencies
        run: flutter pub get

      # 预置钩子解压缓存，让 prepareExtractedArtifact 直接命中、完全不触发上游解压
      - name: Seed ffmpeg-kit hook cache
        shell: bash
        run: |
          set -euo pipefail
          root='.dart_tool/hooks_runner/shared/ffmpeg_kit_extended_flutter/build/ffmpeg_kit_cache/windows/fk'
          rm -rf "$root"
          mkdir -p "$root/fk/bin"
          cp ffmpeg-kit-bundle/work/fk/bin/libffmpegkit.dll "$root/fk/bin/"
          : > "$root/.extract_complete"
          find "$root" -type f -printf '  %p  %s bytes\n'
          echo "✅ 已预置 ffmpeg-kit 解压缓存"

      - name: Build Windows
        run: flutter build windows --release

      - name: List build output
        shell: pwsh
        run: |
          $releaseDir = 'build\windows\x64\runner\Release'
          Write-Host "========================================"
          Write-Host "  构建产物列表: $releaseDir"
          Write-Host "========================================"
          if (Test-Path $releaseDir) {
            Get-ChildItem $releaseDir | ForEach-Object {
              $sizeMB = [math]::Round($_.Length / 1MB, 2)
              Write-Host "  $($_.Name)  ($sizeMB MB)"
            }
            $totalMB = [math]::Round((Get-ChildItem $releaseDir | Measure-Object Length -Sum).Sum / 1MB, 2)
            Write-Host "  总大小: $totalMB MB"
          } else {
            Write-Host "  [目录不存在]"
          }
          Write-Host "========================================"

      - name: Create Windows ZIP
        shell: pwsh
        run: |
          Write-Host "创建 ZIP 包..."
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath windows.zip
          $zipSizeMB = [math]::Round((Get-Item windows.zip).Length / 1MB, 2)
          Write-Host "ZIP 创建完成: windows.zip ($zipSizeMB MB)"

      - name: Rename Windows ZIP
        run: |
          mv windows.zip ./${{ env.APP_NAME }}-${{ needs.metadata.outputs.app_version }}-windows-x86_64.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}-${{ needs.metadata.outputs.app_version }}-windows-x86_64.zip
          path: ${{ env.APP_NAME }}-${{ needs.metadata.outputs.app_version }}-windows-x86_64.zip
          retention-days: 1


  # ========== 发布到 GitHub Releases ==========
  release:
    needs: [ build-android, build-windows ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write  # ✅ 仅 release job 需要写权限
    environment: release  # ✅ 添加环境保护（可选：要求审批）

    steps:
      - name: Checkout code (for changelog)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # ✅ 必须获取完整 tag 历史

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true  # ✅ 简化目录结构

      - name: Generate release notes
        id: notes
        run: |
          # 获取上一个标签
          current_tag=${GITHUB_REF#refs/tags/}
          prev_tag=$(git tag --sort=-version:refname | grep -v "^$current_tag$" | head -1)
          
          body_content=""
          if [[ -n "$prev_tag" ]]; then
            body_content=$(git log --pretty=format:"* %s (%h)" "$prev_tag".."$current_tag" -- . ":(exclude)docs" ":(exclude).github")
          else
            body_content="Initial release or no previous tag found."
          fi
          
          # 写入输出，处理多行字符
          {
            echo "body<<EOF"
            echo "$body_content"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.body }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}  # ✅ 自动识别预发布
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}