name: bilibili_downloader
description: Bilibili 视频下载器 - 支持搜索、扫码登录、高清下载
publish_to: 'none'
version: 0.4.4

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: 6.1.5+1
  dio: 5.9.2
  shared_preferences: 2.5.5
  path_provider: 2.1.5
  intl: 0.20.2
  crypto: 3.0.7
  flutter_local_notifications: 21.0.0
  url_launcher: 6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
