name: flutter_bilibili_downloader_d4_qwen_code
description: Bilibili 视频下载器 - 支持搜索、扫码登录、高清下载
publish_to: 'none'
version: 0.4.34

environment:
  sdk: '>=3.13.5 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: 6.1.5+1
  dio: 5.11.1
  shared_preferences: 2.5.6
  path_provider: 2.1.6
  intl: 0.20.3
  crypto: 3.0.7
  flutter_local_notifications: 22.3.2
  url_launcher: 6.3.3
  ffmpeg_kit_extended_flutter: 0.6.2
  window_manager: 0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true

# ffmpeg-kit 原生库：三个平台都走 gh-proxy 加速（GitHub Releases 在本网络下偏慢）。
ffmpeg_kit_extended_config:
  type: "base"
  android: "https://gh-proxy.org/https://github.com/akashskypatel/ffmpeg-kit-builders/releases/download/v0.11.1-android/bundle-base-shared-lgpl-release.aar"
  linux: "https://gh-proxy.org/https://github.com/akashskypatel/ffmpeg-kit-builders/releases/download/v0.11.1-linux/bundle-base-linux-x86_64-shared-lgpl.zip"
  windows: "https://gh-proxy.org/https://github.com/akashskypatel/ffmpeg-kit-builders/releases/download/v0.11.1-windows/bundle-base-windows-x86_64-shared-lgpl.zip"
