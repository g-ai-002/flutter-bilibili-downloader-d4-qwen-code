name: 构建与发布

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

run-name: 📺 构建 ${{ github.ref_name }}

concurrency:
  group: build-${{ github.sha }}
  cancel-in-progress: true

env:
  APP_NAME: ${{ github.event.repository.name }}
  # Windows 产物内置的 ffmpeg-kit 原生库：上游 builder 版本、bundle 文件名与两个校验值
  FFMPEG_KIT_BUILDER: '0.11.1'
  FFMPEG_KIT_WIN_BUNDLE: 'bundle-base-windows-x86_64-shared-lgpl.zip'
  FFMPEG_KIT_WIN_SHA256: 'ac4f7c6893eb2d2a7d9c1c7a08e8cad42105b509d097ce2b2eceabcdcbd7cb47'
  FFMPEG_KIT_DLL_SHA256: '888a15993862950feed714990e459f653b68bbc2ce30da7d4bda8db9a5212c06'

jobs:
  metadata:
    runs-on: ubuntu-latest
    name: 📋 准备包元数据
    outputs:
      app_version: ${{ steps.version.outputs.jversion }}
      project_name: ${{ steps.project.outputs.project_name }}
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v6

      - name: 🔢 解析包版本号
        id: version
        shell: bash
        run: |
          jversion=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            raw_tag="${{ github.ref_name }}"
            version=$(echo "$raw_tag" | sed -E 's/^[vV]//')
            jversion=$(echo "$version" | sed -E 's/^([0-9]+\.[0-9]+(\.[0-9]+)?).*/\1/')
            if [ -z "$jversion" ]; then
              jversion=$(grep '^version:' pubspec.yaml | awk '{print $2}')
            fi
          fi
          echo "jversion=$jversion" >> $GITHUB_OUTPUT
          echo "📌 使用的版本号: $jversion"

      - name: 🏷️ 计算项目名称
        id: project
        shell: bash
        run: |
          projectName=$(echo "${{ env.APP_NAME }}" | tr '-' '_')
          echo "project_name=$projectName" >> $GITHUB_OUTPUT
          echo "📌 Flutter 项目名: $projectName"

  test:
    needs: [ metadata ]
    runs-on: ubuntu-flutter
    name: 🧪 运行 Dart 测试
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v6

      - name: 📦 安装依赖
        run: flutter pub get

      - name: 🔍 静态分析
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: ✅ 运行测试
        run: flutter test

  build-android:
    needs: [ metadata, test ]
    runs-on: ubuntu-flutter
    name: 🤖 构建 Android APK
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v6

      - name: 📦 安装依赖
        run: flutter pub get

      - name: 🩺 诊断网络与 Flutter 环境
        run: |
          echo "=== 构建环境变量 ==="
          echo "USE_ALIYUN_MAVEN=${USE_ALIYUN_MAVEN:-<未设置>}"
          echo "JAVA_HOME=${JAVA_HOME:-<未设置>}"
          echo "ANDROID_HOME=${ANDROID_HOME:-<未设置>}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-<未设置>}"
          echo "GRADLE_USER_HOME=${GRADLE_USER_HOME:-<未设置>}"
          echo "http_proxy=${http_proxy:-<未设置>}"
          echo "https_proxy=${https_proxy:-<未设置>}"
          echo "=== Flutter 版本 ==="
          flutter --version
          echo "=== Flutter doctor ==="
          timeout 10 flutter doctor -v || true
          echo "=== Flutter 相关环境变量 ==="
          echo "FLUTTER_STORAGE_BASE_URL=${FLUTTER_STORAGE_BASE_URL:-<未设置>}"
          echo "PUB_HOSTED_URL=${PUB_HOSTED_URL:-<未设置>}"
          echo "=== 网络连通性检查 ==="
          curl -sI --connect-timeout 10 https://storage.flutter-io.cn 2>&1 || echo "无法访问 storage.flutter-io.cn"
          curl -sI --connect-timeout 10 https://storage.googleapis.com 2>&1 || echo "无法访问 storage.googleapis.com"

      - name: 🪞 部署阿里云 Maven 镜像脚本
        run: |
          mkdir -p ~/.gradle/init.d
          cp android/gradle/init-aliyun-mirror.gradle ~/.gradle/init.d/init-aliyun-mirror.gradle
          echo "✅ init 脚本已部署到 ~/.gradle/init.d/"
          if [ "${USE_ALIYUN_MAVEN:-}" = "true" ]; then
            echo "🔧 USE_ALIYUN_MAVEN=true，将全局启用阿里云镜像"
          else
            echo "ℹ️ 未设置 USE_ALIYUN_MAVEN，init 脚本将不生效"
          fi

      - name: 🔨 构建 Android APK
        run: flutter build apk --release --target-platform android-arm64

      - name: 📝 重命名 Android APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk ./${{ env.APP_NAME }}-${{ needs.metadata.outputs.app_version }}-android-aarch64.apk

      - name: ⬆️ 上传 Android 产物
        uses: actions/gitea-upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ needs.metadata.outputs.app_version }}-android-aarch64.apk
          path: ${{ env.APP_NAME }}-${{ needs.metadata.outputs.app_version }}-android-aarch64.apk

  build-windows:
    needs: [ metadata, test ]
    runs-on: windows-flutter
    name: 🪟 构建 Windows EXE
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v6

      - name: 🩺 诊断 Flutter 环境
        shell: bash
        run: |
          id
          echo "=== Flutter 版本 ==="
          flutter --version
          echo "=== Flutter doctor ==="
          flutter doctor -v || true

      - name: 📦 安装依赖
        shell: bash
        run: flutter pub get

      - name: 🏗️ 生成 Windows 平台文件
        shell: bash
        run: flutter create --platforms=windows --project-name ${{ needs.metadata.outputs.project_name }} .

      # 上游 bundle 的内部目录名较长，Windows 上 Expand-Archive 会因 MAX_PATH 静默失败
      # （详见 plan.md），因此重打包成短名 fk.zip——内部根目录同为 fk，正好满足钩子
      # 「<extractRoot>/<zip 同名目录>」的回退要求。
      - name: 📦 准备 ffmpeg-kit Windows 原生库
        shell: bash
        run: |
          set -euo pipefail
          url="https://gh-proxy.org/https://github.com/akashskypatel/ffmpeg-kit-builders/releases/download/v${FFMPEG_KIT_BUILDER}-windows/${FFMPEG_KIT_WIN_BUNDLE}"
          mkdir -p ffmpeg-kit-bundle
          echo "URL: $url"
          curl -fL --retry 3 --connect-timeout 30 -o "ffmpeg-kit-bundle/$FFMPEG_KIT_WIN_BUNDLE" "$url"
          actual=$(sha256sum "ffmpeg-kit-bundle/$FFMPEG_KIT_WIN_BUNDLE" | awk '{print $1}')
          if [ "$actual" != "$FFMPEG_KIT_WIN_SHA256" ]; then
            echo "❌ bundle sha256 不符：$actual"
            exit 1
          fi
          rm -rf ffmpeg-kit-bundle/work
          powershell.exe -NoProfile -NonInteractive -Command \
            "Expand-Archive -Path 'ffmpeg-kit-bundle\\$FFMPEG_KIT_WIN_BUNDLE' -DestinationPath 'ffmpeg-kit-bundle\\work' -Force"
          mv "ffmpeg-kit-bundle/work/${FFMPEG_KIT_WIN_BUNDLE%.zip}" ffmpeg-kit-bundle/work/fk
          powershell.exe -NoProfile -NonInteractive -Command \
            "Compress-Archive -Path 'ffmpeg-kit-bundle\\work\\fk' -DestinationPath 'ffmpeg-kit-bundle\\fk.zip' -Force"
          dll_sha=$(sha256sum ffmpeg-kit-bundle/work/fk/bin/libffmpegkit.dll | awk '{print $1}')
          if [ "$dll_sha" != "$FFMPEG_KIT_DLL_SHA256" ]; then
            echo "❌ libffmpegkit.dll sha256 不符：$dll_sha"
            exit 1
          fi
          ls -l ffmpeg-kit-bundle/fk.zip
          echo "✅ 已生成短名 bundle ffmpeg-kit-bundle/fk.zip"

      # 用绝对路径指向本地短名 bundle：无论钩子把 appRoot 解析成什么都能命中
      - name: 🔧 让构建钩子使用本地 bundle
        shell: bash
        run: |
          set -euo pipefail
          bundle_win=$(cygpath -m "$PWD/ffmpeg-kit-bundle/fk.zip")
          awk '!/^  windows: /' pubspec.yaml > pubspec.clean.yaml
          mv pubspec.clean.yaml pubspec.yaml
          awk -v line="  windows: \"$bundle_win\"" \
            '{ print } /^ffmpeg_kit_extended_config:/ { print line }' \
            pubspec.yaml > pubspec.patched.yaml
          mv pubspec.patched.yaml pubspec.yaml
          grep -n -A4 '^ffmpeg_kit_extended_config:' pubspec.yaml
          grep -q '^  windows: ' pubspec.yaml || { echo "❌ windows 覆盖未写入 pubspec.yaml"; exit 1; }

      - name: 📦 重新安装 Windows 依赖
        shell: bash
        run: flutter pub get

      # 预置钩子解压缓存，让 prepareExtractedArtifact 直接命中、完全不触发上游解压
      - name: 🌱 预置 ffmpeg-kit 解压缓存
        shell: bash
        run: |
          set -euo pipefail
          root='.dart_tool/hooks_runner/shared/ffmpeg_kit_extended_flutter/build/ffmpeg_kit_cache/windows/fk'
          rm -rf "$root"
          mkdir -p "$root/fk/bin"
          cp ffmpeg-kit-bundle/work/fk/bin/libffmpegkit.dll "$root/fk/bin/"
          : > "$root/.extract_complete"
          find "$root" -type f -printf '  %p  %s bytes\n'
          echo "✅ 已预置 ffmpeg-kit 解压缓存"

      - name: 🔨 构建 Windows
        shell: bash
        run: flutter build windows --release

      - name: 📊 列出构建产物
        shell: bash
        run: |
          release_dir='build/windows/x64/runner/Release'
          if [ -d "$release_dir" ]; then
            total_bytes=0
            for f in "$release_dir"/*; do
              if [ -f "$f" ]; then
                size=$(stat -c%s "$f")
                size_mb=$(awk "BEGIN{printf \"%.2f\", $size/1048576}")
                echo "  $(basename "$f")  ($size_mb MB)"
                total_bytes=$((total_bytes + size))
              fi
            done
            total_mb=$(awk "BEGIN{printf \"%.2f\", $total_bytes/1048576}")
            echo "  合计: $total_mb MB"
          else
            echo "❌ 未找到构建输出目录"
            exit 1
          fi

      - name: 🗜️ 打包 Windows ZIP
        shell: bash
        run: |
          set -euo pipefail
          powershell.exe -NoProfile -NonInteractive -Command "Compress-Archive -Path 'build\windows\x64\runner\Release\*' -DestinationPath 'windows.zip' -Force"
          zip_size=$(stat -c%s windows.zip)
          zip_size_mb=$(awk "BEGIN{printf \"%.2f\", $zip_size/1048576}")
          echo "ZIP 大小: $zip_size_mb MB"

      - name: 📝 重命名 Windows ZIP
        shell: bash
        run: |
          mv -f windows.zip "./${{ env.APP_NAME }}-${{ needs.metadata.outputs.app_version }}-windows-x86_64.zip"

      - name: ⬆️ 上传 Windows 产物
        uses: actions/gitea-upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ needs.metadata.outputs.app_version }}-windows-x86_64.zip
          path: ${{ env.APP_NAME }}-${{ needs.metadata.outputs.app_version }}-windows-x86_64.zip

  release:
    needs: [ metadata, build-android, build-windows ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    name: 🚀 创建 Gitea Release
    permissions:
      contents: write
    environment: release
    steps:
      - name: 📥 检出代码（用于生成更新日志）
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: ⬇️ 下载 Android 产物
        uses: actions/gitea-download-artifact@v8
        with:
          name: ${{ env.APP_NAME }}-${{ needs.metadata.outputs.app_version }}-android-aarch64.apk
          path: artifacts

      - name: ⬇️ 下载 Windows 产物
        uses: actions/gitea-download-artifact@v8
        with:
          name: ${{ env.APP_NAME }}-${{ needs.metadata.outputs.app_version }}-windows-x86_64.zip
          path: artifacts

      - name: 📝 生成发布说明
        id: notes
        run: |
          current_tag=${GITHUB_REF#refs/tags/}
          prev_tag=$(git tag --sort=-version:refname | grep -v "^$current_tag$" | head -1)
          if [[ -n "$prev_tag" ]]; then
            git log --pretty=format:"* %s (%h)" "$prev_tag".."$current_tag" -- . ":(exclude)docs" ":(exclude).github" ":(exclude).gitea" > /tmp/release_body.txt
          else
            echo "首次发布。" > /tmp/release_body.txt
          fi
          echo "=== 发布说明 ==="
          cat /tmp/release_body.txt

      - name: 🚀 创建 Gitea Release
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          PRERELEASE=false
          if echo "${{ github.ref_name }}" | grep -qE -- '-(rc|beta)'; then
            PRERELEASE=true
          fi

          BODY_JSON=$(jq -Rs . < /tmp/release_body.txt)
          response=$(curl -s -X POST \
            "${{ github.server_url }}/api/v1/repos/${{ github.repository }}/releases" \
            -H "Authorization: token $GITEA_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"${{ github.ref_name }}\",\"name\":\"${{ github.ref_name }}\",\"body\":${BODY_JSON},\"draft\":false,\"prerelease\":${PRERELEASE}}")

          release_id=$(echo "$response" | jq .id)

          if [ -z "$release_id" ] || [ "$release_id" = "null" ]; then
            echo "❌ 创建 Release 失败: $response"
            exit 1
          fi

          echo "✅ 已创建 Release，ID: $release_id"

          for file in artifacts/*; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              echo "⬆️ 正在上传 $filename ..."
              curl -s -X POST \
                "${{ github.server_url }}/api/v1/repos/${{ github.repository }}/releases/$release_id/assets?name=$filename" \
                -H "Authorization: token $GITEA_TOKEN" \
                -H "Content-Type: application/octet-stream" \
                --data-binary "@$file"
            fi
          done
