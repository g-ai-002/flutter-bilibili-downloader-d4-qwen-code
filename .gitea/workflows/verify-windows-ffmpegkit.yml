name: 验证 Windows 切换 ffmpeg_kit（临时）

# 临时验证工作流（仅手动触发）：确认 Windows 版能否像 Android 一样统一到
# ffmpeg_kit_extended_flutter —— 即直接用 pubspec.yaml 里的 ffmpeg_kit 依赖 +
# Android 那份 lib/services/ffmpeg_platform.dart 构建 Windows 产物，
# 不再执行 build.yml 的「切换 Windows 平台依赖」与「下载并内置 ffmpeg」两步。
#
# 第一轮：诊断步骤假设 pub 缓存在 %LOCALAPPDATA%，自建 runner 上不存在 → 已修正。
# 第二轮：本地核实 v0.11.1-windows base bundle = <root>/bin/libffmpegkit.dll（唯一二进制，
#   无 ffmpeg.exe），与钩子预期一致。
# 第三轮：拿到钩子 stderr —— 配置与本地 bundle 覆盖都生效，随后抛
#   PathNotFoundException: Directory listing failed, path =
#   '...ffmpeg_kit_cache\windows\bundle-...-lgpl\bundle-...-lgpl\*'
#   即钩子解压后 extractRoot 内没有 zip 的同名目录（等价于解压什么都没产出）。
#   本机用同一个 zip + 同一句 Expand-Archive、连 339 字符长路径都解压正常，
#   说明是自建 runner 的 PowerShell 行为差异。
#
# 第四轮（本版）：两手准备
#   a) 🧪 复刻钩子解压（对照长短路径）—— 记录 wrapper 侧 PowerShell 的真实行为；
#   b) 🧰🌱 用短名 fk.zip 重打包 + 直接预置钩子的解压缓存（marker .extract_complete）
#      —— 让 prepareExtractedArtifact 直接命中缓存、完全不触发解压，
#      从而把「DLL 能否打进产物 + 运行时能否无损合并」这个问题单独验出来。
#
# 验证结论出来后，本文件与 tool/verify_ffmpeg_kit_windows_test.dart 可一并删除。
#
# 注意：Gitea 的 shell: bash 带 -e（出错即中止），诊断类命令一律加 `|| true`。

on:
  workflow_dispatch:

run-name: 🧪 验证 Windows 平替 ffmpeg_kit

concurrency:
  group: verify-windows-ffmpegkit
  cancel-in-progress: true

env:
  APP_NAME: ${{ github.event.repository.name }}
  # 原生库 bundle：与 pubspec.yaml 里 linux 那条保持同一 builder 版本（均为 v0.11.1-*）
  FFMPEG_KIT_BUILDER: '0.11.1'
  FFMPEG_KIT_WIN_BUNDLE: 'bundle-base-windows-x86_64-shared-lgpl.zip'
  # 上游 release v0.11.1-windows 的 asset digest（17144043 字节）
  FFMPEG_KIT_WIN_SHA256: 'ac4f7c6893eb2d2a7d9c1c7a08e8cad42105b509d097ce2b2eceabcdcbd7cb47'
  # 解开该 zip 后 bin/libffmpegkit.dll 的 sha256（54565256 字节），用于校验重打包内容
  FFMPEG_KIT_DLL_SHA256: '888a15993862950feed714990e459f653b68bbc2ce30da7d4bda8db9a5212c06'
  FFMPEG_KIT_WIN_MIRROR: 'https://gh-proxy.org/https://github.com/akashskypatel/ffmpeg-kit-builders/releases/download'

jobs:
  verify:
    runs-on: windows-flutter
    timeout-minutes: 60
    name: 🪟 Windows + ffmpeg_kit 验证
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v6

      - name: 🩺 诊断 Flutter 环境
        shell: bash
        run: |
          set +e
          flutter --version
          which powershell || true
          cygpath -w "$(which powershell)" 2>/dev/null || true
          powershell.exe -NoProfile -NonInteractive -Command '$PSVersionTable.PSVersion.ToString(); $PSHOME' || true
          which tar unzip || true
          echo "PWD=$PWD"
          flutter doctor -v || true

      - name: 🏷️ 计算项目名
        id: project
        shell: bash
        run: |
          projectName=$(printf '%s' "$APP_NAME" | tr '-' '_')
          if [ -z "$projectName" ]; then
            projectName=$(basename "$PWD" | tr '-' '_')
          fi
          echo "project_name=$projectName" >> $GITHUB_OUTPUT
          echo "📌 Flutter 项目名: $projectName"

      - name: 🏗️ 生成 Windows 平台文件
        shell: bash
        run: flutter create --platforms=windows --project-name ${{ steps.project.outputs.project_name }} .

      - name: 📦 安装依赖
        shell: bash
        run: flutter pub get

      # 关键差异：这里不覆盖 lib/services/ffmpeg_platform.dart，
      # 即 Windows 也用 Android 那份 FFmpegKit 实现。
      - name: 🔎 确认构建钩子期望的 builder 版本
        shell: bash
        run: |
          set +e
          cfg=.dart_tool/package_config.json
          if [ ! -f "$cfg" ]; then
            echo "⚠️ 未找到 $cfg，跳过 builder 版本核对"
            exit 0
          fi
          root_uri=$(powershell.exe -NoProfile -NonInteractive -Command \
            "(Get-Content -Raw '.dart_tool/package_config.json' | ConvertFrom-Json).packages | Where-Object { \$_.name -eq 'ffmpeg_kit_extended_flutter' } | Select-Object -ExpandProperty rootUri" \
            | tr -d '\r' | awk 'NF { print; exit }')
          if [ -z "$root_uri" ]; then
            echo "⚠️ package_config.json 内未解析到 ffmpeg_kit_extended_flutter，跳过核对"
            exit 0
          fi
          pkg_dir=$(printf '%s' "$root_uri" | sed 's|^file:///||')
          echo "包目录: $pkg_dir"
          hook_file="$pkg_dir/hook/build.dart"
          if [ ! -f "$hook_file" ]; then
            echo "⚠️ 未找到 $hook_file，跳过核对"
            exit 0
          fi
          grep -nE 'String version = |_extractMarkerFileName|extractRootFor' "$hook_file" || true
          hook_version=$(grep -oE 'String version = "[^"]+"' "$hook_file" \
            | awk 'NR==1' | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true)
          echo "hook builder 版本: ${hook_version:-未知}（本工作流按 $FFMPEG_KIT_BUILDER）"
          if [ -n "$hook_version" ] && [ "$hook_version" != "$FFMPEG_KIT_BUILDER" ]; then
            echo "⚠️ 版本不一致：若构建或合并失败，先把 env 里的 FFMPEG_KIT_BUILDER"
            echo "   与 FFMPEG_KIT_WIN_SHA256 换成 v${hook_version}-windows 对应 bundle 的值"
            touch .builder_mismatch
          else
            echo "✅ builder 版本一致（或无法判定，已跳过）"
          fi
          exit 0

      - name: ⬇️ 预下载 Windows 原生库 bundle 并校验
        shell: bash
        run: |
          set -euo pipefail
          url="$FFMPEG_KIT_WIN_MIRROR/v$FFMPEG_KIT_BUILDER-windows/$FFMPEG_KIT_WIN_BUNDLE"
          mkdir -p ffmpeg-kit-bundle
          echo "URL: $url"
          if ! curl -fL --retry 3 --connect-timeout 30 \
            -o "ffmpeg-kit-bundle/$FFMPEG_KIT_WIN_BUNDLE" "$url"; then
            echo "❌ 下载失败。可改用直连地址重试："
            echo "   https://github.com/akashskypatel/ffmpeg-kit-builders/releases/download/v$FFMPEG_KIT_BUILDER-windows/$FFMPEG_KIT_WIN_BUNDLE"
            exit 1
          fi
          size=$(stat -c%s "ffmpeg-kit-bundle/$FFMPEG_KIT_WIN_BUNDLE")
          echo "下载字节数: $size（上游记录为 17144043）"
          actual=$(sha256sum "ffmpeg-kit-bundle/$FFMPEG_KIT_WIN_BUNDLE" | awk '{print $1}')
          echo "sha256: $actual"
          if [ "$actual" != "$FFMPEG_KIT_WIN_SHA256" ]; then
            echo "❌ sha256 与上游 release 记录不一致（可能被代理/镜像改写，或版本不匹配）"
            exit 1
          fi
          echo "✅ bundle 校验通过（bin/ 内只有一个 libffmpegkit.dll，无 ffmpeg.exe）"

      # 对照实验：把钩子里那句 Expand-Archive 原样搬到工作流里跑一遍
      - name: 🧪 复刻钩子解压（长短路径对照）
        shell: bash
        continue-on-error: true
        run: |
          set +e
          shared=".dart_tool/hooks_runner/shared/ffmpeg_kit_extended_flutter/build"
          up=$(cygpath -m "$PWD/ffmpeg-kit-bundle/$FFMPEG_KIT_WIN_BUNDLE")
          zipbase="${FFMPEG_KIT_WIN_BUNDLE%.zip}"
          for variant in "long:$zipbase" "short:fk"; do
            name="${variant%%:*}"
            rootdir="${variant##*:}"
            dest_win=$(cygpath -m "$PWD/$shared/probe_cache/$rootdir.extracting")
            rm -rf "$shared/probe_cache/$rootdir.extracting"
            mkdir -p "$shared/probe_cache/$rootdir.extracting"
            echo "----- $name: 解压到 $dest_win -----"
            powershell.exe -NoProfile -NonInteractive -Command \
              "Expand-Archive -Path '$up' -DestinationPath '$dest_win' -Force"
            echo "powershell 退出码: $?"
            echo "顶层条目: $(ls -1 "$shared/probe_cache/$rootdir.extracting" 2>/dev/null | tr '\n' ' ')"
            find "$shared/probe_cache/$rootdir.extracting" -maxdepth 3 -type d 2>/dev/null | awk 'NR<=12'
          done
          exit 0

      - name: 🧰 重打包为短名 bundle（root=fk）
        shell: bash
        run: |
          set -euo pipefail
          work=ffmpeg-kit-bundle/work
          rm -rf "$work"
          mkdir -p "$work"
          powershell.exe -NoProfile -NonInteractive -Command \
            "Expand-Archive -Path 'ffmpeg-kit-bundle\\$FFMPEG_KIT_WIN_BUNDLE' -DestinationPath 'ffmpeg-kit-bundle\\work' -Force"
          mv "$work/$FFMPEG_KIT_WIN_BUNDLE" "$work/fk" 2>/dev/null \
            || mv "$work/${FFMPEG_KIT_WIN_BUNDLE%.zip}" "$work/fk"
          powershell.exe -NoProfile -NonInteractive -Command \
            "Compress-Archive -Path 'ffmpeg-kit-bundle\\work\\fk' -DestinationPath 'ffmpeg-kit-bundle\\fk.zip' -Force"
          powershell.exe -NoProfile -NonInteractive -Command \
            "Add-Type -AssemblyName System.IO.Compression.FileSystem; \
             [IO.Compression.ZipFile]::OpenRead((Resolve-Path 'ffmpeg-kit-bundle\\fk.zip').Path).Entries \
             | Where-Object { \$_.FullName -notlike '*/include/*' } \
             | ForEach-Object { \$_.FullName + '  ' + \$_.Length }" | awk 'NR<=20'
          dll_sha=$(sha256sum "$work/fk/bin/libffmpegkit.dll" | awk '{print $1}')
          echo "libffmpegkit.dll sha256: $dll_sha"
          [ "$dll_sha" = "$FFMPEG_KIT_DLL_SHA256" ] \
            || { echo "❌ DLL sha256 与预期不符（$FFMPEG_KIT_DLL_SHA256）"; exit 1; }
          echo "✅ 短名 bundle 内容校验通过"

      - name: 🔧 写入 windows 覆盖（绝对路径 → fk.zip）
        shell: bash
        run: |
          set -euo pipefail
          bundle_win=$(cygpath -m "$PWD/ffmpeg-kit-bundle/fk.zip")
          echo "将写入 windows 覆盖: $bundle_win"
          [ -f ffmpeg-kit-bundle/fk.zip ] || { echo "❌ fk.zip 不存在"; exit 1; }
          awk -v line="  windows: \"$bundle_win\"" \
            '{ print } /^ffmpeg_kit_extended_config:/ { print line }' \
            pubspec.yaml > pubspec.patched.yaml
          mv pubspec.patched.yaml pubspec.yaml
          grep -n -A4 '^ffmpeg_kit_extended_config:' pubspec.yaml
          grep -q '^  windows: ' pubspec.yaml || { echo "❌ windows 覆盖未写入 pubspec.yaml"; exit 1; }

      - name: 📦 重新安装依赖
        shell: bash
        run: flutter pub get

      # 直接命中钩子的解压缓存（marker + payload），完全绕开上游解压逻辑
      - name: 🌱 预置钩子解压缓存
        shell: bash
        run: |
          set -euo pipefail
          shared='.dart_tool/hooks_runner/shared/ffmpeg_kit_extended_flutter/build'
          cache="$shared/ffmpeg_kit_cache/windows"
          root="$cache/fk"
          rm -rf "$root"
          mkdir -p "$root/fk/bin"
          cp ffmpeg-kit-bundle/work/fk/bin/libffmpegkit.dll "$root/fk/bin/"
          : > "$root/.extract_complete"
          echo "=== 预置后的缓存树 ==="
          find "$cache" -maxdepth 4 2>/dev/null | awk 'NR<=20'
          find "$root" -type f -printf '  %p  %s bytes\n'
          echo "✅ 已预置 extractRoot=$root（含 marker 与 fk/bin/libffmpegkit.dll）"

      - name: 🔨 构建 Windows（verbose，抓钩子日志）
        shell: bash
        continue-on-error: true
        run: |
          set +e
          flutter build windows --release -v > build-windows.log 2>&1
          echo "$?" > .build_exit
          echo "=== 构建退出码: $(cat .build_exit) ==="
          echo "=== 钩子/原生资源相关日志 ==="
          grep -niE 'ffmpegkit|build hook|build_hooks|native asset|code_asset|code asset|local override|using app configuration|using package-local|no configuration found|downloading http|sha256|failed to|exception|LNK[0-9]|MSB[0-9]|unresolved|objective_c|hooks_runner' build-windows.log | awk 'NR<=300' || true
          echo "=== 日志总行数: $(awk 'END { print NR }' build-windows.log) ==="
          echo "=== 日志尾部 80 行 ==="
          tail -n 80 build-windows.log
          exit 0

      - name: 🧾 收集诊断（钩子缓存 / native assets / 产物）
        shell: bash
        continue-on-error: true
        run: |
          set +e
          mkdir -p diag
          shared='.dart_tool/hooks_runner/shared/ffmpeg_kit_extended_flutter/build'
          {
            echo "构建退出码: $(cat .build_exit 2>/dev/null || echo unknown)"
            echo "=== 钩子 shared 目录树 ==="
            find "$shared" -maxdepth 5 2>/dev/null | awk 'NR<=60'
            echo "=== hooks_runner 下的文件 ==="
            find .dart_tool/hooks_runner -maxdepth 3 -type f 2>/dev/null | awk 'NR<=80'
          } | tee diag/summary.txt
          for f in $(find .dart_tool/hooks_runner -type f \( -name 'stdout.txt' -o -name 'stderr.txt' \) 2>/dev/null | awk 'NR<=40'); do
            echo "===== $f ====="
            awk 'NR<=200 { print }' "$f"
          done | tee diag/hooks-output.txt
          echo "=== native assets 相关文件 ===" | tee diag/native-assets.txt
          find .dart_tool build/windows -maxdepth 8 -type f -iname '*native_asset*' 2>/dev/null \
            | awk 'NR<=40' | tee -a diag/native-assets.txt
          for f in $(find .dart_tool build/windows -maxdepth 8 -type f -iname '*native_asset*' 2>/dev/null | awk 'NR<=10'); do
            echo "===== $f ====="
            awk 'NR<=150 { print }' "$f"
          done | tee -a diag/native-assets.txt
          find build/windows -maxdepth 3 -type d 2>/dev/null | awk 'NR<=80' | tee diag/build-tree.txt
          if [ -f build-windows.log ]; then
            size=$(stat -c%s build-windows.log)
            echo "verbose 日志字节数: $size"
            if [ "$size" -lt 20971520 ]; then
              cp build-windows.log diag/build-windows.log.full
            else
              tail -n 3000 build-windows.log > diag/build-windows.log.tail
            fi
            grep -niE 'ffmpegkit|build hook|build_hooks|native asset|code_asset|code asset|local override|using app configuration|failed|exception|error:|LNK[0-9]|MSB[0-9]|unresolved|objective_c' \
              build-windows.log | awk 'NR<=500' > diag/build-windows.filtered.txt
          fi
          echo "=== diag 目录 ==="
          ls -l diag
          exit 0

      - name: 🗜️ 打包诊断
        shell: bash
        continue-on-error: true
        run: |
          powershell.exe -NoProfile -NonInteractive -Command \
            "Compress-Archive -Path 'diag\*' -DestinationPath 'verify-windows-diag.zip' -Force"

      - name: ⬆️ 上传诊断包
        uses: actions/gitea-upload-artifact@v4
        with:
          name: verify-windows-diag.zip
          path: verify-windows-diag.zip

      - name: 🚦 判定产物
        shell: bash
        run: |
          set +e
          release_dir='build/windows/x64/runner/Release'
          if [ ! -d "$release_dir" ]; then
            echo "❌ 构建未产出 $release_dir —— 看上面 🔨 与 🧾 两步输出，或下载 verify-windows-diag.zip"
            exit 1
          fi
          echo "✅ 产物目录存在"

      - name: 🔍 校验产物中的 ffmpeg-kit 原生库
        shell: bash
        run: |
          set -uo pipefail
          release_dir='build/windows/x64/runner/Release'
          echo "=== $release_dir ==="
          if [ ! -d "$release_dir" ]; then
            echo "❌ 未找到构建输出目录"
            exit 1
          fi
          total=0
          for f in "$release_dir"/*; do
            [ -f "$f" ] || continue
            size=$(stat -c%s "$f")
            total=$((total + size))
            awk -v n="$(basename "$f")" -v s="$size" \
              'BEGIN{printf "  %s  (%.2f MB)\n", n, s/1048576}'
          done
          awk -v s="$total" 'BEGIN{printf "  合计: %.2f MB（不含 ffmpeg.exe，本次不内置）\n", s/1048576}'
          main_dll=$(find "$release_dir" -maxdepth 1 -type f -iname '*ffmpegkit*.dll' | awk 'NR==1')
          if [ -z "$main_dll" ]; then
            echo "❌ Release 目录内未找到 libffmpegkit*.dll，code asset 未打进产物"
            echo "--- 在 build/windows 全树中搜索 ---"
            find build/windows -type f -iname '*.dll' | grep -iE 'ffmpegkit|avformat|avcodec' || echo "（也没有找到）"
            exit 1
          fi
          dll_count=$(find "$release_dir" -maxdepth 1 -type f -iname '*.dll' | wc -l)
          echo "✅ 主库: $(basename "$main_dll")；Release 目录 DLL 总数: $dll_count"
          find "$release_dir" -maxdepth 1 -type f -iname '*.dll' -printf '  %f\n' | sort

      - name: 🧪 进程内 FFI 自检（flutter test，非致命）
        shell: bash
        continue-on-error: true
        run: |
          cp tool/verify_ffmpeg_kit_windows_test.dart test/verify_ffmpeg_kit_windows_test.dart
          flutter test test/verify_ffmpeg_kit_windows_test.dart -r expanded
          echo "ℹ️ 若上面失败且报 DLL 加载/插件缺失，说明 flutter test 环境不走 code asset，需人工实测"

      - name: 🗜️ 打包验证产物
        shell: bash
        run: |
          set -euo pipefail
          powershell.exe -NoProfile -NonInteractive -Command \
            "Compress-Archive -Path 'build\windows\x64\runner\Release\*' -DestinationPath 'verify-windows.zip' -Force"
          size=$(stat -c%s verify-windows.zip)
          awk -v s="$size" 'BEGIN{printf "ZIP 大小: %.2f MB\n", s/1048576}'

      - name: ⬆️ 上传验证产物
        uses: actions/gitea-upload-artifact@v4
        with:
          name: verify-windows-ffmpegkit.zip
          path: verify-windows.zip

      - name: 📋 结论清单
        shell: bash
        run: |
          echo '1) 构建通过 = 0.6.2 钩子的解压缺陷可用「预置缓存/短名 bundle」绕过'
          echo '2) Release 目录出现 libffmpegkit.dll = code asset 打包链路可用'
          echo '3) 把 verify-windows-ffmpegkit.zip 在真机解压后下载一个 DASH 视频 = 端到端确认'
          echo '   重点看：合并成功、中文/emoji 标题的文件名、日志里的「已合并视频/音频」'
          if [ -f .builder_mismatch ]; then
            echo '⚠️ 构建钩子期望的 builder 版本与本工作流 pin 的 0.11.1 不一致，'
            echo '   请把 URL/哈希换成对应版本后重跑，否则本轮的结论只算参考。'
          fi
